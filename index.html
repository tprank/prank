<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tprank</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; padding: 40px 20px 80px; min-height: 100vh; position: relative; overflow-x: hidden; }
  body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 999; background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000); background-size: 300% 100%; animation: rainbowMove 3s linear infinite; }
  @keyframes rainbowMove { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; background: linear-gradient(135deg, #ff0044, #ff6600, #ffcc00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; }
  .sub { color: #888; font-size: 14px; margin-bottom: 40px; text-align: center; }
  .list { display: flex; flex-direction: column; gap: 24px; }
  .prank-card { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; transition: all 0.25s; position: relative; overflow: hidden; }
  .prank-card:hover { background: rgba(255,0,68,0.08); border-color: rgba(255,0,68,0.4); box-shadow: 0 10px 30px rgba(255,0,68,0.2); }
  .prank-img { width: 100%; max-width: 300px; aspect-ratio: 1 / 1; border-radius: 18px; background-size: cover; background-position: center; background-color: #1a1a2e; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; transition: transform 0.3s; }
  .prank-card:hover .prank-img { transform: scale(1.03); }
  .prank-img .new-badge { position: absolute; top: -10px; right: -10px; font-size: 12px; font-weight: 900; padding: 6px 12px; border-radius: 100px; background: linear-gradient(135deg, #ff0044, #ff6600); color: #fff; letter-spacing: 1.5px; box-shadow: 0 4px 16px rgba(255,0,68,0.8); animation: newPulse 1.5s ease-in-out infinite; z-index: 2; }
  @keyframes newPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .prank-title { font-size: 20px; font-weight: 800; text-align: center; line-height: 1.3; word-break: break-word; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .prank-title .new-badge-inline { font-size: 10px; font-weight: 900; padding: 3px 9px; border-radius: 100px; background: linear-gradient(135deg, #ff0044, #ff6600); color: #fff; letter-spacing: 1px; animation: newPulse 1.5s ease-in-out infinite; }
  .prank-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 32px; border-radius: 14px; background: linear-gradient(135deg, #ff0044, #ff6600); color: #fff; font-size: 15px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 24px rgba(255,0,68,0.4); transition: all 0.25s; position: relative; overflow: hidden; letter-spacing: 0.5px; }
  .prank-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); transition: left 0.6s; pointer-events: none; }
  .prank-btn:hover::before { left: 100%; }
  .prank-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(255,0,68,0.6); }
  .prank-btn:active { transform: translateY(-1px) scale(0.98); }
  .prank-btn .arrow { font-size: 18px; transition: transform 0.25s; }
  .prank-btn:hover .arrow { transform: translateX(4px); }
  .empty { text-align: center; padding: 60px 20px; color: #666; font-size: 14px; }
  .loading { text-align: center; padding: 60px 20px; color: #666; font-size: 14px; }
  .footer { margin-top: 50px; color: #555; font-size: 13px; text-align: center; }
  .footer a { color: #ff0044; text-decoration: none; font-weight: 700; }
  .footer a:hover { text-decoration: underline; }
  @media (max-width: 480px) { .prank-title { font-size: 17px; } .prank-img { max-width: 240px; } .prank-btn { padding: 12px 26px; font-size: 14px; } }
</style>
</head>
<body>
<div class="container">
  <h1>tprank</h1>
  <div class="sub">Выбирай пранк — записывай на NFC-метку</div>
  <div class="list" id="prankList"><div class="loading">Загрузка...</div></div>
  <div class="footer">Сделал <a href="https://tretiy1337.ru" target="_blank">tretiy1337.ru</a></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
(function() {
  const firebaseConfig = {
    apiKey: "AIzaSyDGb-vDdeM3vbACbIqQ_Yy4Yom6vsQdViY",
    authDomain: "unogame-9414d.firebaseapp.com",
    databaseURL: "https://unogame-9414d-default-rtdb.firebaseio.com",
    projectId: "unogame-9414d",
    storageBucket: "unogame-9414d.firebasestorage.app",
    messagingSenderId: "609200346253",
    appId: "1:609200346253:web:4ca96722ecad9ea0cffec4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const list = document.getElementById('prankList');
  db.ref('pranks').on('value', snap => {
    const data = snap.val() || {};
    const keys = Object.keys(data);
    if (!keys.length) { list.innerHTML = '<div class="empty">Пранков пока нет</div>'; return; }
    list.innerHTML = keys.map(k => {
      const p = data[k];
      const url = p.url || (k + '.html');
      const newBadgeImg = p.isNew ? '<div class="new-badge">NEW</div>' : '';
      const newBadgeTitle = p.isNew ? '<span class="new-badge-inline">NEW</span>' : '';
      return `<div class="prank-card">
        <div class="prank-img" style="background-image: url('${esc(p.image)}')">${newBadgeImg}</div>
        <div class="prank-title">${esc(p.title || k)}${newBadgeTitle}</div>
        <a href="${esc(url)}" class="prank-btn">Открыть <span class="arrow">→</span></a>
      </div>`;
    }).join('');
  });
})();
</script>
</body>
</html>
